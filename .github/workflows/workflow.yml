name: Mirroring

on: [ push ]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Clang-Format
        run: |
          sudo apt update
          sudo apt install -y clang-format
          echo -e "BasedOnStyle: LLVM\nIndentWidth: 4\nTabWidth: 4" > .clang-format
      - name: Apply Clang-Format to C++ code
        run: |
          find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | xargs clang-format -i --style=file
      - name: Commit and push formatted code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply code formatting using Clang-Format"
          git push origin ${{ github.ref_name }}

  compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3 make cmake g++ git
      - name: Run install script
        run: |
          python3 install.py
      - name: Fix vcpkg paths for CMake
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/vcpkg/installed/x64-linux
      - name: Compile project
        run: |
          make

  documentation:
    if: github.ref == 'refs/heads/main'
    needs: [compilation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Doxygen
        run: |
          sudo apt update
          sudo apt install -y doxygen graphviz
      - name: Ensure necessary directories
        run: |
          if [ ! -d client ] || [ ! -d serveur ] || [ ! -d lib ] || [ ! -d doc ]; then
            echo "Required directories (client, serveur, lib, or doc) are missing."
            exit 1
          fi
      - name: Generate Doxyfile if not present
        run: |
          if [ ! -f Doxyfile ]; then
            echo "Doxyfile not found. Generating a default one."
            doxygen -g
            # Update Doxyfile with the correct configuration
            sed -i 's|^INPUT .*|INPUT = client/include client/src serveur/include serveur/src lib/ecs/include lib/ecs/src lib/others/events/include lib/others/systems/physics doc README.md|' Doxyfile
            sed -i 's|^FILE_PATTERNS .*|FILE_PATTERNS = *.cpp *.h *.hpp|' Doxyfile
            sed -i 's|^OUTPUT_DIRECTORY .*|OUTPUT_DIRECTORY = docs|' Doxyfile
          fi
      - name: Generate Documentation
        run: |
          doxygen Doxyfile
      - name: Save Documentation to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git pull origin ${{ github.ref_name }} --rebase
          git add --force docs
          git commit -m "Add or update generated documentation" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs

  mirroring:
    if: github.repository == 'giordano-pierre/R-Type'
    needs: ${{ github.ref == 'refs/heads/main' && ['linting', 'compilation', 'documentation'] || ['linting', 'compilation'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/dev" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This branch is not allowed to push to the target repository."
            exit 0
          fi
      - name: Mirroring Epitech repository
        if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            "git@github.com:EpitechPromo2027/B-CPP-500-LYN-5-2-rtype-nathan.baudelin"
          ssh_private_key:
            ${{ secrets.SSH_PRIVATE_KEY }}
